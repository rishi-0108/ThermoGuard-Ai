# Chunk 4 synthetic data generation configuration.
seed: 20261023
split:
  method: chronological
  train_fraction: 0.70
  validation_fraction: 0.15
  test_fraction: 0.15
scenarios:
  - name: validation_gradual_drift
    anomaly_type: gradual_drift
    segment: validation
    start_position: 200
    duration: 72
    magnitude: 5.0
    affected_feature: OT
  - name: test_positive_spike
    anomaly_type: sudden_spike
    segment: test
    start_position: 300
    duration: 3
    magnitude: 15.0
    affected_feature: OT
  - name: test_negative_spike
    anomaly_type: sudden_spike
    segment: test
    start_position: 600
    duration: 2
    magnitude: -12.0
    affected_feature: OT
  - name: test_variance_increase
    anomaly_type: variance_change
    segment: test
    start_position: 1200
    duration: 48
    variance_multiplier: 3.0
    affected_feature: OT
